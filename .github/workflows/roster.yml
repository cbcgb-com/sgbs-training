# Roster app CI.
#
# Both deploy paths run on Vercel's side: the project build command (see
# apps/roster/vercel.json) is `npx convex deploy --cmd 'npm run build'
# --cmd-url-env-var-name VITE_CONVEX_URL`, which pushes Convex functions
# and bakes the backend URL into the frontend build. The deploy key lives
# as a Vercel project env var (CONVEX_DEPLOY_KEY): Production target =
# prod deploy key, Preview target = preview deploy key.
#
# Preview deploys get a per-branch isolated Convex backend with this
# branch's functions. It is seeded from the project's default env vars
# for preview deployments (SMTP_USER/SMTP_PASS/AUTH_PRIVATE_KEY via
# `npx convex env default --type preview`), so registration emails
# really send — but its data is throwaway.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

name: roster

on:
  pull_request:
    paths:
      - "apps/roster/**"
      - ".github/workflows/roster.yml"
  push:
    branches: [master]
    paths:
      - "apps/roster/**"
      - ".github/workflows/roster.yml"

concurrency:
  group: roster-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/roster
    steps:
      - uses: actions/checkout@v4
      - name: Vercel preview deploy
        id: deploy
        run: |
          URL=$(npx vercel@latest deploy --token="$VERCEL_TOKEN" \
            | grep -Eo 'https://[a-zA-Z0-9.-]*vercel\.app' | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Comment preview URL on PR
        run: |
          gh pr comment "$NUMBER" --body \
            "🔎 Vercel preview: $URL
          Backend: an isolated per-branch **Convex preview deployment**
          running this PR's functions (throwaway data; preview default env
          vars apply, so registration emails really send)."
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}

  deploy-prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/roster
    steps:
      - uses: actions/checkout@v4
      - name: Vercel production deploy (Convex functions + frontend)
        run: npx vercel@latest deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
